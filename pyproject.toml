[project]
name = "streamweights"
version = "0.1.0"
description = "Build your own model on the Mac you already own: fine-tune and distill from a 70B teacher locally with MLX, even when the model is bigger than your RAM. The same jobs run on Linux and CUDA through PyTorch and resume across machines."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Amrish Kapoor" }]
keywords = ["mlx", "apple-silicon", "llm", "fine-tuning", "lora", "distillation",
            "local-llm", "llama", "qwen", "evaluation", "batch-inference", "gguf", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: GPU",
]
dependencies = [
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "huggingface-hub>=0.24",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "torch>=2.4",
    "transformers>=4.50",
    "peft>=0.13",
    "safetensors>=0.4.3",
    "fsspec>=2024.6",
    "psutil>=5.9",
    "mlx>=0.30; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.30; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build", "twine"]
cloud = ["s3fs>=2024.6", "gcsfs>=2024.6", "adlfs>=2024.7"]

[project.urls]
Homepage = "https://github.com/streamweights/streamweights"
Repository = "https://github.com/streamweights/streamweights"
Issues = "https://github.com/streamweights/streamweights/issues"
Discussions = "https://github.com/streamweights/streamweights/discussions"
Documentation = "https://github.com/streamweights/streamweights/tree/main/docs"

[project.scripts]
spill = "streamweights.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["streamweights"]
artifacts = ["streamweights/data/**", "streamweights/models.yaml"]

[tool.hatch.build.targets.sdist]
include = ["/streamweights", "/tests", "/docs/*.md", "/README.md", "/LICENSE", "/pyproject.toml"]
exclude = ["/scripts", "/state", "/jobs", "/runs", "/adapters", "/models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
