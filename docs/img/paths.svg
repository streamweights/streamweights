<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 280" role="img"
     aria-label="Three bars with lengths proportional to measured time: labels only about an
     hour, labels plus teacher one night, training the 70B itself several nights.">
  <style>
    :root { --ink:#1f2328; --mute:#59636e; --line:#8c959f; --card:#f6f8fa; --accent:#0969da;
            --accent-bg:#ddf4ff; --big:#bf3989; --big-bg:#ffeff7; --bar:#0969da; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#e6edf3; --mute:#9198a1; --line:#6e7681; --card:#161b22; --accent:#4493f8;
              --accent-bg:#102a4c; --big:#e275ad; --big-bg:#3b1230; --bar:#4493f8; }
    }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .mute { fill: var(--mute); }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .build { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2.5; }
    .big { fill: var(--big-bg); stroke: var(--big); stroke-width: 2; stroke-dasharray: 7 5; }
    .arrow { stroke: var(--line); stroke-width: 2.5; fill: none; marker-end: url(#a); }
    .arrow-big { stroke: var(--big); stroke-width: 2.5; fill: none; stroke-dasharray: 7 5;
                 marker-end: url(#ab); }
    .bar { fill: var(--bar); }
    .bar-big { fill: var(--big); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--big)"/></marker>
  </defs>
  <text x="234" y="52" text-anchor="end" font-size="18" font-weight="600">labels only</text><text class="mute" x="234" y="72" text-anchor="end" font-size="13">student learns from your answers</text><rect class="bar" x="250" y="34" width="9" height="40" rx="6"/><text x="271" y="61" font-size="17" font-weight="600">about an hour</text><text x="234" y="132" text-anchor="end" font-size="18" font-weight="600">labels plus teacher</text><text class="mute" x="234" y="152" text-anchor="end" font-size="13">the big model adds answers</text><rect class="bar" x="250" y="114" width="95" height="40" rx="6"/><text x="357" y="141" font-size="17" font-weight="600">about 11 hours</text><text x="234" y="212" text-anchor="end" font-size="18" font-weight="600">train the 70B itself</text><text class="mute" x="234" y="232" text-anchor="end" font-size="13">an adapter on the big model</text><rect class="bar-big" x="250" y="194" width="520" height="40" rx="6"/><text x="782" y="221" font-size="17" font-weight="600">about 2.5 days</text>
  <text class="mute" x="250" y="262" font-size="13">bar length is proportional to wall time on
  one 48 GB laptop</text>
</svg>
