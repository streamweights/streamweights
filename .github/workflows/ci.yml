name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, python: "3.12" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.10" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install -e ".[dev]"
      - name: Cache the 0.5B weights
        uses: actions/cache@v4
        with:
          path: models/qwen2.5-0.5b
          key: qwen2.5-0.5b-bf16-st-v1
      - name: Download qwen2.5:0.5b (the resume fixture runs on it)
        env:
          SPILL_MIN_FREE_GB: "2"
        run: python -c "from streamweights.registry import download_safetensors; download_safetensors('qwen2.5:0.5b')"
      - name: Command line smoke test
        run: |
          spill --help
          spill doctor
      - name: build is not Mac-only any more (Linux)
        if: runner.os == 'Linux'
        env:
          SPILL_HEADLESS: "0"
        run: |
          out=$(spill build /nonexistent 2>&1 || true)
          echo "$out"
          test "$(echo "$out" | wc -l)" = 1
          echo "$out" | grep -q "is not a folder"
      - name: banking77-tiny, end to end (Linux)
        if: runner.os == 'Linux' && matrix.python == '3.12'
        env:
          SPILL_HEADLESS: "0"
        run: |
          mkdir tiny && cd tiny
          start=$(date +%s)
          spill example banking77 --tiny && spill build banking77-tiny
          secs=$(( $(date +%s) - start ))
          echo "banking77-tiny, example and build, on this runner: ${secs} s"
          echo "### banking77-tiny end to end: ${secs} s" >> "$GITHUB_STEP_SUMMARY"
      - name: CPU test suite
        run: python -m pytest -q -rs
        env:
          SPILL_DEVICE: cpu
          SPILL_REQUIRE_FIXTURE_MODEL: "1"

  object-store:
    name: S3 ownership and handoff against a pinned MinIO (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
      SPILL_DEVICE: cpu
      SPILL_REQUIRE_FIXTURE_MODEL: "1"
      SPILL_MIN_FREE_GB: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,cloud]"
      - uses: actions/cache@v4
        with:
          path: models
          key: models-qwen05-minilm-v2
      - name: Download qwen2.5:0.5b at its pinned revision
        run: python -c "from streamweights.registry import download_safetensors; download_safetensors('qwen2.5:0.5b')"
      - name: Start the pinned MinIO and log its version
        run: |
          IMAGE=quay.io/minio/minio:$MINIO_RELEASE
          if ! docker pull "$IMAGE"; then
            echo "the upstream image is not available; building the same release from its source tag"
            docker build -f docker/minio.Dockerfile --build-arg RELEASE=$MINIO_RELEASE -t spill-minio:$MINIO_RELEASE docker
            IMAGE=spill-minio:$MINIO_RELEASE
          fi
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=spilltest -e MINIO_ROOT_PASSWORD=spilltest123 "$IMAGE" server /data
          VERSION=$(docker run --rm --entrypoint minio "$IMAGE" --version | head -1)
          echo "image: $IMAGE"; echo "$VERSION"
          { echo "### MinIO used for the S3 gates"; echo; echo "image \`$IMAGE\`"; echo; echo "\`$VERSION\`"; } >> "$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
      - name: Ownership, publication and handoff on MinIO (and local disk)
        env:
          AWS_ACCESS_KEY_ID: spilltest
          AWS_SECRET_ACCESS_KEY: spilltest123
          AWS_ENDPOINT_URL: http://127.0.0.1:9000
          AWS_DEFAULT_REGION: us-east-1
          SPILL_TEST_S3_BUCKET: spill-ci
        run: |
          python - <<'PY'
          import boto3
          boto3.client("s3").create_bucket(Bucket="spill-ci")
          PY
          python -m pytest tests/test_ownership.py tests/test_move.py -v -rs 2>&1 | tee pytest.log
          if grep -q "no S3 endpoint" pytest.log; then echo "an S3 case was skipped"; exit 1; fi
          grep -E "passed|failed" pytest.log | tail -1 >> "$GITHUB_STEP_SUMMARY"

  journey:
    name: The CSV journey from the built wheel (Linux, torch-cpu, GGUF)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPILL_MIN_FREE_GB: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the tools that build and install the wheel
        run: |
          python -m pip install --upgrade pip build uv
      - uses: actions/cache@v4
        with:
          path: models
          key: models-qwen05-minilm-v2
      - name: Fresh install of the wheel, then the journey with the installed CLI
        run: |
          mkdir -p models
          export SPILL_MODELS_FROM="$PWD/models" SPILL_JOURNEY_OUT="$PWD/wheel-journey.json"
          python scripts/fresh_wheel.py --journey --home /tmp/spillhome > wheel.json
          python - <<'PY'
          import json
          d = json.load(open("wheel.json"))
          print("wheel", d["wheel"], "imported from", d["imported_from"])
          assert d["all_ok"] and d["outside_checkout"]
          PY
      - name: The journey with GGUF export, on the checkout
        env:
          SPILL_DEVICE: cpu
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
          python scripts/gates_015.py --home /tmp/gatehome --work /tmp/gatework --out journey-gguf.json --engines torch-cpu
      - uses: actions/upload-artifact@v4
        with:
          name: journey
          path: |
            wheel.json
            wheel-journey.json
            journey-gguf.json

  docs-commands:
    name: Every documented command, parsed, and the small-model ones run (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPILL_DEVICE: cpu
      SPILL_MIN_FREE_GB: "2"
      SPILL_DOCS_RUN: "1"
      SPILL_REQUIRE_FIXTURE_MODEL: "1"
      MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
      AWS_ACCESS_KEY_ID: spilltest
      AWS_SECRET_ACCESS_KEY: spilltest123
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_DEFAULT_REGION: us-east-1
      SPILL_DOCS_S3: s3://spill-docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,cloud]"
      - uses: actions/cache@v4
        with:
          path: models
          key: models-qwen05-minilm-v2
      - name: Download qwen2.5:0.5b
        run: python -c "from streamweights.registry import download_safetensors; download_safetensors('qwen2.5:0.5b')"
      - name: Start the pinned MinIO (the documented move and resume run against it)
        run: |
          IMAGE=quay.io/minio/minio:$MINIO_RELEASE
          if ! docker pull "$IMAGE"; then
            docker build -f docker/minio.Dockerfile --build-arg RELEASE=$MINIO_RELEASE -t spill-minio:$MINIO_RELEASE docker
            IMAGE=spill-minio:$MINIO_RELEASE
          fi
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=spilltest -e MINIO_ROOT_PASSWORD=spilltest123 "$IMAGE" server /data
          docker run --rm --entrypoint minio "$IMAGE" --version | head -1
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          python -c "import boto3; boto3.client('s3').create_bucket(Bucket='spill-docs')"
      - name: Documented commands
        run: python -m pytest tests/test_docs_commands.py tests/test_docs.py -v

  offline-bundle:
    name: Offline bundle gate (container with --network none)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPILL_MIN_FREE_GB: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: models
          key: models-qwen05-minilm-v2
      - name: Build the tiny project, its bundle and the wheel (online)
        run: |
          python -m pip install --upgrade pip build
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
          python -c "from streamweights.registry import download_safetensors; download_safetensors('qwen2.5:0.5b')"
          python scripts/gate_offline_bundle.py prepare --work /tmp/off
      - name: Runtime dependencies image
        run: docker build -f docker/offline.Dockerfile -t spill-offline-deps .
      - name: "Offline, no network: install the wheel from a file, import the bundle, infer, fork, train, reject corruption"
        run: |
          mkdir -p /tmp/offout
          docker run --rm --network none \
            -v /tmp/off/dist:/in/dist:ro -v /tmp/off/bundle:/in/bundle:ro \
            -v "$PWD/scripts":/scripts:ro -v /tmp/offout:/out \
            spill-offline-deps sh -c 'pip install --no-deps --no-index /in/dist/*.whl && python /scripts/gate_offline_bundle.py offline --bundle /in/bundle --work /tmp/gate --out /out/result.json'
          python - <<'PY'
          import json
          d = json.load(open("/tmp/offout/result.json"))
          print(json.dumps([(c["name"], c["ok"]) for c in d["checks"]], indent=1))
          assert d["all_ok"], "an offline check failed"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: offline-bundle
          path: /tmp/offout/result.json

  resolution:
    name: boto3 and s3fs resolution (clean venv and both images)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean venv with the cloud extra
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/v/bin/pip install -q ".[cloud]"
          /tmp/v/bin/pip list 2>/dev/null | grep -iE "^(boto3|botocore|aiobotocore|s3fs) " | tee /tmp/venv-versions.txt
          cat /tmp/venv-versions.txt >> "$GITHUB_STEP_SUMMARY"
      - name: CPU and CUDA images resolve the same extra
        run: |
          docker build -f docker/cpu.Dockerfile -t spill-cpu .
          docker run --rm --entrypoint pip spill-cpu list 2>/dev/null | grep -iE "^(boto3|botocore|aiobotocore|s3fs) " | tee /tmp/cpu-versions.txt
          sed -n '/pip install/,/^$/p' docker/cuda.Dockerfile
          docker build -f docker/cuda.Dockerfile -t spill-cuda . 2>&1 | tail -3
          docker run --rm --entrypoint pip spill-cuda list 2>/dev/null | grep -iE "^(boto3|botocore|aiobotocore|s3fs) " | tee /tmp/cuda-versions.txt
          { echo "cpu image"; cat /tmp/cpu-versions.txt; echo "cuda image"; cat /tmp/cuda-versions.txt; } >> "$GITHUB_STEP_SUMMARY"
