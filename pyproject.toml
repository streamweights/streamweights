[project]
name = "streamweights"
version = "0.0.1"
description = "Run the unmodified full-size model against your eval set, on your machine, for free, overnight, with no data leaving the building."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "huggingface-hub>=0.24",
    "python-multipart>=0.0.9",
]

[project.scripts]
spill = "streamweights.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["streamweights"]
