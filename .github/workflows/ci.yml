name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, python: "3.12" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.10" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install -e ".[dev]"
      - name: Cache the 0.5B weights
        uses: actions/cache@v4
        with:
          path: models/qwen2.5-0.5b
          key: qwen2.5-0.5b-bf16-st-v1
      - name: Download qwen2.5:0.5b (the resume fixture runs on it)
        env:
          SPILL_MIN_FREE_GB: "2"
        run: python -c "from streamweights.registry import download_safetensors; download_safetensors('qwen2.5:0.5b')"
      - name: Command line smoke test
        run: |
          spill --help
          spill doctor
      - name: build is not Mac-only any more (Linux)
        if: runner.os == 'Linux'
        env:
          SPILL_HEADLESS: "0"
        run: |
          out=$(spill build /nonexistent 2>&1 || true)
          echo "$out"
          test "$(echo "$out" | wc -l)" = 1
          echo "$out" | grep -q "is not a folder"
      - name: banking77-tiny, end to end (Linux)
        if: runner.os == 'Linux' && matrix.python == '3.12'
        env:
          SPILL_HEADLESS: "0"
        run: |
          mkdir tiny && cd tiny
          start=$(date +%s)
          spill example banking77 --tiny && spill build banking77-tiny
          secs=$(( $(date +%s) - start ))
          echo "banking77-tiny, example and build, on this runner: ${secs} s"
          echo "### banking77-tiny end to end: ${secs} s" >> "$GITHUB_STEP_SUMMARY"
      - name: CPU test suite
        run: python -m pytest -q -rs
        env:
          SPILL_DEVICE: cpu
          SPILL_REQUIRE_FIXTURE_MODEL: "1"
